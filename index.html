<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functional Training Cervinia - Prenotazione</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 15px; min-height: 100vh; }
    
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
    header p { color: var(--subtext); font-size: 0.95rem; }

    .container { max-width: 500px; margin: 0 auto; display: grid; gap: 15px; }

    .date-picker-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid #334155;
    }
    .date-picker-card label { display: block; font-weight: bold; margin-bottom: 8px; }
    .date-picker-card input[type="date"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      width: 100%;
      max-width: 250px;
      text-align: center;
    }

    .error-msg { color: #f87171; font-size: 0.9rem; margin-top: 8px; display: none; }

    .slot-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .time { font-size: 1.2rem; font-weight: bold; }
    .badge { background: #334155; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
    .badge.full { background: #991b1b; color: #fecaca; }

    .form-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); }

    button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background-color: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .attendees-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .attendee-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .btn-cancel {
      background: transparent;
      color: var(--danger);
      padding: 2px 6px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Functional Training Cervinia 🏔️</h1>
    <p>Seleziona la data e inserisci il tuo nome per prenotare.<br>Massimo 5 persone per slot.</p>
  </header>

  <div class="container">
    <div class="date-picker-card">
      <label for="booking-date">Scegli la data dell'allenamento:</label>
      <input type="date" id="booking-date" min="2026-10-31" max="2027-05-02">
      <div id="error-msg" class="error-msg">Iscrizioni aperte solo nei weekend (Sab/Dom) o nel periodo natalizio (23 Dic - 8 Gen).</div>
    </div>

    <div id="slots-container"></div>
  </div>

  <script>
    const MAX_CAPACITY = 5;
    const SLOTS = ["14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];
    const dateInput = document.getElementById('booking-date');
    const errorMsg = document.getElementById('error-msg');

    // Imposta come data predefinita oggi se valida, altrimenti la prima data utile (31 ott)
    const todayStr = new Date().toISOString().split('T')[0];
    dateInput.value = isDateValid(todayStr) ? todayStr : "2026-10-31";

    function isDateValid(dateString) {
      if (!dateString) return false;
      const date = new Date(dateString + 'T00:00:00');
      
      const startSeason = new Date('2026-10-31T00:00:00');
      const endSeason = new Date('2027-05-02T00:00:00');

      if (date < startSeason || date > endSeason) return false;

      // Periodo Natalizio: 23 Dicembre - 8 Gennaio
      const month = date.getMonth(); // 0 = Gen, 11 = Dic
      const day = date.getDate();
      
      const isXmasPeriod = (month === 11 && day >= 23) || (month === 0 && day <= 8);
      if (isXmasPeriod) return true;

      // Altrimenti solo Sabato (6) e Domenica (0)
      const dayOfWeek = date.getDay();
      return dayOfWeek === 0 || dayOfWeek === 6;
    }

    function getBookings() {
      const stored = localStorage.getItem('cervinia_bookings_v2');
      return stored ? JSON.parse(stored) : {};
    }

    function saveBookings(allBookings) {
      localStorage.setItem('cervinia_bookings_v2', JSON.stringify(allBookings));
      render();
    }

    function addBooking(selectedDate, slot, inputId) {
      const input = document.getElementById(inputId);
      const name = input.value.trim();
      if (!name) return;

      const allBookings = getBookings();
      if (!allBookings[selectedDate]) allBookings[selectedDate] = {};
      if (!allBookings[selectedDate][slot]) allBookings[selectedDate][slot] = [];

      if (allBookings[selectedDate][slot].length < MAX_CAPACITY) {
        allBookings[selectedDate][slot].push(name);
        saveBookings(allBookings);
        input.value = '';
      }
    }

    function removeBooking(selectedDate, slot, index) {
      const allBookings = getBookings();
      if (allBookings[selectedDate] && allBookings[selectedDate][slot]) {
        allBookings[selectedDate][slot].splice(index, 1);
        saveBookings(allBookings);
      }
    }

    function render() {
      const selectedDate = dateInput.value;
      const container = document.getElementById('slots-container');
      container.innerHTML = '';

      if (!isDateValid(selectedDate)) {
        errorMsg.style.display = 'block';
        return;
      } else {
        errorMsg.style.display = 'none';
      }

      const allBookings = getBookings();
      const dateBookings = allBookings[selectedDate] || {};

      SLOTS.forEach((slot, index) => {
        const list = dateBookings[slot] || [];
        const isFull = list.length >= MAX_CAPACITY;
        const available = MAX_CAPACITY - list.length;
        const inputId = `input-${index}`;

        const card = document.createElement('div');
        card.className = 'slot-card';
        card.innerHTML = `
          <div class="slot-header">
            <span class="time">Ore ${slot}</span>
            <span class="badge ${isFull ? 'full' : ''}">
              ${isFull ? 'Completo' : `${available} posti liberi`}
            </span>
          </div>

          <div class="form-group">
            <input type="text" id="${inputId}" placeholder="Scrivi il tuo nome" ${isFull ? 'disabled' : ''}>
            <button onclick="addBooking('${selectedDate}', '${slot}', '${inputId}')" ${isFull ? 'disabled' : ''}>Prenota</button>
          </div>

          <ul class="attendees-list">
            ${list.map((name, i) => `
              <li class="attendee-item">
                <span>👤 ${name}</span>
                <button class="btn-cancel" onclick="removeBooking('${selectedDate}', '${slot}', ${i})">Cancella</button>
              </li>
            `).join('')}
          </ul>
        `;
        container.appendChild(card);
      });
    }

    dateInput.addEventListener('change', render);
    render();
  </script>
</body>
</html>
