<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functional Training Cervinia - Booking</title>
  
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 15px; min-height: 100vh; }
    
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
    header p { color: var(--subtext); font-size: 0.95rem; }

    .container { max-width: 500px; margin: 0 auto; display: grid; gap: 15px; }

    .step-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }

    .step-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 8px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--subtext);
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-btn {
      padding: 10px 0;
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .day-btn:hover { background: #334155; }
    .day-btn.selected { background: var(--accent); border-color: var(--accent); }
    .day-btn:disabled { opacity: 0.25; cursor: not-allowed; border-color: transparent; }
    .day-empty { background: transparent; border: none; }

    .slot-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .time { font-size: 1.2rem; font-weight: bold; }
    .badge { background: #334155; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
    .badge.full { background: #991b1b; color: #fecaca; }

    .form-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); }

    .btn-submit {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background-color: var(--accent-hover); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .attendees-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .attendee-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .btn-cancel {
      background: transparent;
      color: var(--danger);
      padding: 2px 6px;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Functional Training Cervinia 🏔️</h1>
    <p>Select month, day, and time slot to book your workout.</p>
  </header>

  <div class="container">
    <div class="step-card">
      <div class="step-title">1. Select Month</div>
      <select id="month-select" onchange="renderDays()">
        <option value="2026-10">October 2026</option>
        <option value="2026-11">November 2026</option>
        <option value="2026-12">December 2026</option>
        <option value="2027-01">January 2027</option>
        <option value="2027-02">February 2027</option>
        <option value="2027-03">March 2027</option>
        <option value="2027-04">April 2027</option>
        <option value="2027-05">May 2027</option>
      </select>
    </div>

    <div class="step-card">
      <div class="step-title">2. Select Day</div>
      <div class="weekdays-grid">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
      </div>
      <div id="days-container" class="days-grid"></div>
    </div>

    <div id="slots-container"></div>
  </div>

  <script>
    // --- EMAILJS CONFIGURATION ---
    const EMAILJS_PUBLIC_KEY = "puwNNWhFY_Bn07wU6";
    const EMAILJS_SERVICE_ID = "service_fqd23dt";
    const EMAILJS_TEMPLATE_ID = "template_gzhcw2w";

    emailjs.init(EMAILJS_PUBLIC_KEY);

    function sendNotification(action, name, date, slot) {
      const templateParams = {
        action: action,
        user_name: name,
        booking_date: date,
        booking_slot: slot
      };

      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
        .then(() => console.log('Notification email sent successfully!'))
        .catch(err => console.error('Failed to send email:', err));
    }

    const MAX_CAPACITY = 5;
    const SLOTS = ["14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];
    const BLOCKED_DATES = ["2026-12-25", "2027-01-01"];

    let selectedDateStr = "";

    function isDateValid(year, month, day) {
      const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      if (BLOCKED_DATES.includes(dateStr)) return false;

      const date = new Date(year, month - 1, day);
      const startSeason = new Date(2026, 9, 31);
      const endSeason = new Date(2027, 4, 2);

      if (date < startSeason || date > endSeason) return false;

      const isXmas = (month === 12 && day >= 23) || (month === 1 && day <= 8);
      if (isXmas) return true;

      const dayOfWeek = date.getDay();
      return dayOfWeek === 0 || dayOfWeek === 6;
    }

    function renderDays() {
      const monthVal = document.getElementById('month-select').value;
      const [year, month] = monthVal.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();
      
      const firstDayJS = new Date(year, month - 1, 1).getDay();
      const startOffset = (firstDayJS === 0) ? 6 : firstDayJS - 1;

      const container = document.getElementById('days-container');
      container.innerHTML = '';

      for (let i = 0; i < startOffset; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-empty';
        container.appendChild(emptyCell);
      }

      let firstValidDayFound = false;

      for (let d = 1; d <= daysInMonth; d++) {
        const isValid = isDateValid(year, month, d);
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        
        const btn = document.createElement('button');
        btn.className = 'day-btn';
        btn.innerText = d;
        btn.disabled = !isValid;

        if (isValid) {
          if (!firstValidDayFound) {
            selectedDateStr = dateStr;
            btn.classList.add('selected');
            firstValidDayFound = true;
          }

          btn.onclick = () => {
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedDateStr = dateStr;
            renderSlots();
          };
        }

        container.appendChild(btn);
      }

      if (!firstValidDayFound) selectedDateStr = "";
      renderSlots();
    }

    function getBookings() {
      const stored = localStorage.getItem('cervinia_bookings_v3');
      return stored ? JSON.parse(stored) : {};
    }

    function saveBookings(allBookings) {
      localStorage.setItem('cervinia_bookings_v3', JSON.stringify(allBookings));
      renderSlots();
    }

    function addBooking(slot, inputId) {
      const input = document.getElementById(inputId);
      const name = input.value.trim();
      if (!name || !selectedDateStr) return;

      const allBookings = getBookings();
      if (!allBookings[selectedDateStr]) allBookings[selectedDateStr] = {};
      if (!allBookings[selectedDateStr][slot]) allBookings[selectedDateStr][slot] = [];

      if (allBookings[selectedDateStr][slot].length < MAX_CAPACITY) {
        allBookings[selectedDateStr][slot].push(name);
        saveBookings(allBookings);
        
        sendNotification("NUOVA PRENOTAZIONE", name, selectedDateStr, slot);
        
        input.value = '';
      }
    }

    function removeBooking(slot, index) {
      const allBookings = getBookings();
      if (allBookings[selectedDateStr] && allBookings[selectedDateStr][slot]) {
        const removedName = allBookings[selectedDateStr][slot][index];
        allBookings[selectedDateStr][slot].splice(index, 1);
        saveBookings(allBookings);

        sendNotification("CANCELLAZIONE", removedName, selectedDateStr, slot);
      }
    }

    function renderSlots() {
      const container = document.getElementById('slots-container');
      container.innerHTML = '';

      if (!selectedDateStr) {
        container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">No available days selected for this month.</div>';
        return;
      }

      const allBookings = getBookings();
      const dateBookings = allBookings[selectedDateStr] || {};

      SLOTS.forEach((slot, index) => {
        const list = dateBookings[slot] || [];
        const isFull = list.length >= MAX_CAPACITY;
        const available = MAX_CAPACITY - list.length;
        const inputId = `input-${index}`;

        const card = document.createElement('div');
        card.className = 'slot-card';
        card.innerHTML = `
          <div class="slot-header">
            <span class="time">${slot}</span>
            <span class="badge ${isFull ? 'full' : ''}">
              ${isFull ? 'Fully Booked' : `${available} spots available`}
            </span>
          </div>

          <div class="form-group">
            <input type="text" id="${inputId}" placeholder="Enter your name" ${isFull ? 'disabled' : ''}>
            <button class="btn-submit" onclick="addBooking('${slot}', '${inputId}')" ${isFull ? 'disabled' : ''}>Book</button>
          </div>

          <ul class="attendees-list">
            ${list.map((name, i) => `
              <li class="attendee-item">
                <span>👤 ${name}</span>
                <button class="btn-cancel" onclick="removeBooking('${slot}', ${i})">Cancel</button>
              </li>
            `).join('')}
          </ul>
        `;
        container.appendChild(card);
      });
    }

    renderDays();
  </script>
</body>
</html>
